<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f17">
<title>Radar de Ofertas</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0b0f17; color: #e8edf5; -webkit-font-smoothing: antialiased;
  }
  header {
    position: sticky; top: 0; z-index: 5; padding: 16px 16px 12px;
    background: rgba(11,15,23,.92); backdrop-filter: blur(8px);
    border-bottom: 1px solid #1d2533;
  }
  h1 { font-size: 20px; margin: 0 0 2px; letter-spacing: .3px; }
  .sub { font-size: 12px; color: #7d8aa0; margin-bottom: 12px; }
  .controls { display: flex; gap: 8px; }
  #q {
    flex: 1; padding: 11px 14px; border-radius: 12px; border: 1px solid #243047;
    background: #121826; color: #e8edf5; font-size: 15px; outline: none;
  }
  #q:focus { border-color: #3b82f6; }
  #sort {
    padding: 0 12px; border-radius: 12px; border: 1px solid #243047;
    background: #121826; color: #e8edf5; font-size: 14px;
  }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 12px 16px 4px; }
  .chip {
    flex: 0 0 auto; padding: 7px 14px; border-radius: 999px; font-size: 13px;
    border: 1px solid #243047; background: #121826; color: #aab6c9; cursor: pointer;
  }
  .chip.active { background: #1d4ed8; border-color: #1d4ed8; color: #fff; }
  main { padding: 8px 16px 40px; display: grid; gap: 12px; max-width: 720px; margin: 0 auto; }
  .card {
    background: #121826; border: 1px solid #1d2533; border-radius: 16px;
    padding: 14px 16px; display: flex; align-items: center; gap: 14px;
  }
  .save {
    flex: 0 0 auto; width: 62px; height: 62px; border-radius: 14px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-weight: 700; background: #0e2a1a; color: #4ade80; border: 1px solid #1f5135;
  }
  .save small { font-size: 10px; font-weight: 600; opacity: .8; }
  .save.low { background: #2a230e; color: #fbbf24; border-color: #51421f; }
  .info { flex: 1; min-width: 0; }
  .name { font-size: 15px; font-weight: 600; margin: 0 0 3px; }
  .meta { font-size: 12px; color: #7d8aa0; display: flex; gap: 8px; flex-wrap: wrap; }
  .badge { background: #1b2233; color: #9fb0c9; padding: 2px 8px; border-radius: 6px; }
  .price { font-size: 17px; font-weight: 700; margin-top: 5px; }
  .price small { font-size: 12px; font-weight: 500; color: #7d8aa0; }
  .price s { font-size: 13px; font-weight: 500; color: #5b6577; margin-left: 4px; }
  .go {
    flex: 0 0 auto; text-decoration: none; color: #93c5fd; font-size: 13px;
    border: 1px solid #243047; padding: 8px 12px; border-radius: 10px;
  }
  .empty { text-align: center; color: #7d8aa0; padding: 48px 0; }
  footer { text-align: center; color: #4b5568; font-size: 11px; padding: 0 16px 32px; }
</style>
</head>
<body>
<header>
  <h1>🛒 Radar de Ofertas</h1>
  <div class="sub">Actualizado: 31/05/2026 05:18 UTC · 14 ofertas</div>
  <div class="controls">
    <input id="q" type="search" placeholder="Buscar producto…" autocomplete="off">
    <select id="sort">
      <option value="savings">Mayor ahorro</option>
      <option value="price">Menor precio</option>
    </select>
  </div>
</header>
<div class="chips" id="chips"></div>
<main id="list"></main>
<footer>Datos de muestra · Radar Ofertas CBA</footer>
<script>
const DEALS = [{"name": "Atún al natural 170g", "brand": "La Campagnola", "size_ml": null, "price_ars": 1490.0, "list_price": 1990.0, "price_unit": null, "url": "https://día.example.com/atún", "store": "Día", "ts": "2026-05-30T16:18:49.093181", "savings_pct": 25.125628140703515}, {"name": "Detergente 750ml", "brand": "Magistral", "size_ml": 750, "price_ars": 1790.0, "list_price": 2390.0, "price_unit": 2.3866666666666667, "url": "https://día.example.com/detergente", "store": "Día", "ts": "2026-05-30T20:18:49.093181", "savings_pct": 25.10460251046025}, {"name": "Aceite de girasol 900ml", "brand": "Natura", "size_ml": 900, "price_ars": 1990.0, "list_price": 2650.0, "price_unit": 2.2111111111111112, "url": "https://carrefour.example.com/aceite", "store": "Carrefour", "ts": "2026-05-31T04:18:49.093181", "savings_pct": 24.90566037735849}, {"name": "Leche entera 1L", "brand": "La Serenísima", "size_ml": 1000, "price_ars": 980.0, "list_price": 1290.0, "price_unit": 0.98, "url": "https://día.example.com/leche", "store": "Día", "ts": "2026-05-31T05:18:49.093181", "savings_pct": 24.031007751937985}, {"name": "Galletitas surtidas 400g", "brand": "Bagley", "size_ml": null, "price_ars": 1290.0, "list_price": 1690.0, "price_unit": null, "url": "https://día.example.com/galletitas", "store": "Día", "ts": "2026-05-30T19:18:49.093181", "savings_pct": 23.668639053254438}, {"name": "Gaseosa lima-limón 2.25L", "brand": "Sprite", "size_ml": 2250, "price_ars": 2290.0, "list_price": 2990.0, "price_unit": 1.0177777777777777, "url": "https://carrefour.example.com/gaseosa", "store": "Carrefour", "ts": "2026-05-30T21:18:49.093181", "savings_pct": 23.411371237458194}, {"name": "Fideos tirabuzón 500g", "brand": "Lucchetti", "size_ml": null, "price_ars": 950.0, "list_price": 1190.0, "price_unit": null, "url": "https://día.example.com/fideos", "store": "Día", "ts": "2026-05-31T00:18:49.093181", "savings_pct": 20.168067226890756}, {"name": "Manteca 200g", "brand": "La Paulina", "size_ml": null, "price_ars": 1390.0, "list_price": 1690.0, "price_unit": null, "url": "https://carrefour.example.com/manteca", "store": "Carrefour", "ts": "2026-05-30T17:18:49.093181", "savings_pct": 17.75147928994083}, {"name": "Yerba mate 1kg", "brand": "Playadito", "size_ml": null, "price_ars": 3290.0, "list_price": 3990.0, "price_unit": null, "url": "https://día.example.com/yerba", "store": "Día", "ts": "2026-05-31T02:18:49.093181", "savings_pct": 17.543859649122805}, {"name": "Arroz largo fino 1kg", "brand": "Gallo", "size_ml": null, "price_ars": 1490.0, "list_price": 1790.0, "price_unit": null, "url": "https://día.example.com/arroz", "store": "Día", "ts": "2026-05-30T23:18:49.093181", "savings_pct": 16.75977653631285}, {"name": "Coca-Cola 2.25L", "brand": "Coca-Cola", "size_ml": 2250, "price_ars": 2490.0, "list_price": 2990.0, "price_unit": 1.1066666666666667, "url": "https://carrefour.example.com/coca-cola", "store": "Carrefour", "ts": "2026-05-31T03:18:49.093181", "savings_pct": 16.722408026755854}, {"name": "Azúcar 1kg", "brand": "Ledesma", "size_ml": null, "price_ars": 1190.0, "list_price": 1390.0, "price_unit": null, "url": "https://carrefour.example.com/azúcar", "store": "Carrefour", "ts": "2026-05-30T22:18:49.093181", "savings_pct": 14.388489208633093}, {"name": "Harina 0000 1kg", "brand": "Pureza", "size_ml": null, "price_ars": 850.0, "list_price": 990.0, "price_unit": null, "url": "https://día.example.com/harina", "store": "Día", "ts": "2026-05-30T18:18:49.093181", "savings_pct": 14.14141414141414}, {"name": "Café molido 250g", "brand": "La Virginia", "size_ml": null, "price_ars": 2990.0, "list_price": 3450.0, "price_unit": null, "url": "https://carrefour.example.com/café", "store": "Carrefour", "ts": "2026-05-31T01:18:49.093181", "savings_pct": 13.333333333333334}];
let store = "Todas", sort = "savings", q = "";

const fmt = n => "$" + n.toLocaleString("es-AR", {maximumFractionDigits: 0});
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => (
  {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const stores = ["Todas", ...[...new Set(DEALS.map(d => d.store).filter(Boolean))]];

const chips = document.getElementById("chips");
stores.forEach(s => {
  const b = document.createElement("button");
  b.className = "chip" + (s === store ? " active" : "");
  b.textContent = s;
  b.onclick = () => { store = s; [...chips.children].forEach(c => c.classList.toggle("active", c.textContent === s)); render(); };
  chips.appendChild(b);
});

document.getElementById("q").oninput = e => { q = e.target.value.toLowerCase(); render(); };
document.getElementById("sort").onchange = e => { sort = e.target.value; render(); };

function render() {
  let rows = DEALS.filter(d =>
    (store === "Todas" || d.store === store) &&
    (!q || d.name.toLowerCase().includes(q) || (d.brand||"").toLowerCase().includes(q))
  );
  rows.sort((a, b) => sort === "price" ? a.price_ars - b.price_ars : b.savings_pct - a.savings_pct);
  const list = document.getElementById("list");
  if (!rows.length) { list.innerHTML = '<div class="empty">Sin resultados</div>'; return; }
  list.innerHTML = rows.map(d => {
    const s = Math.round(d.savings_pct);
    const unit = d.size_ml ? `<small> · ${fmt(d.price_unit*1000)}/L</small>` : "";
    const orig = (d.list_price && d.list_price > d.price_ars) ? `<s>${fmt(d.list_price)}</s>` : "";
    const url = /^https?:\/\//.test(d.url || "") ? d.url : "#";
    return `<div class="card">
      <div class="save ${s < 15 ? 'low' : ''}">${s}%<small>OFF</small></div>
      <div class="info">
        <p class="name">${esc(d.name)}</p>
        <div class="meta">${d.store ? `<span class="badge">${esc(d.store)}</span>`:""}${d.brand?`<span>${esc(d.brand)}</span>`:""}</div>
        <div class="price">${fmt(d.price_ars)} ${orig}${unit}</div>
      </div>
      <a class="go" href="${esc(url)}" target="_blank" rel="noopener">Ver</a>
    </div>`;
  }).join("");
}
render();
</script>
</body>
</html>
